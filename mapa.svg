<svg viewBox="0 0 900 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="mapaTitle mapaDesc">
  <title id="mapaTitle">Mapa Aberto — rotas de viagem</title>
  <desc id="mapaDesc">Ilustração de um mapa estilizado com três destinos marcados e ligados por linhas: Lençóis Maranhenses, Chapada Diamantina e Vale do Elqui.</desc>

  <defs>
    <linearGradient id="sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0B222E"/>
      <stop offset="50%" stop-color="#1B3A4B"/>
      <stop offset="100%" stop-color="#2C5364"/>
    </linearGradient>
    <linearGradient id="land" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F1E7CE"/>
      <stop offset="100%" stop-color="#DFCDA3"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#3E6A78" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#3E6A78" stop-opacity="0"/>
    </radialGradient>
    <filter id="softShadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#0B222E" flood-opacity="0.4"/>
    </filter>
    <pattern id="waves" width="40" height="14" patternUnits="userSpaceOnUse">
      <path d="M0,7 Q10,0 20,7 Q30,14 40,7" fill="none" stroke="#3E6A78" stroke-width="1" opacity="0.35"/>
    </pattern>
  </defs>

  <!-- Fundo -->
  <rect x="0" y="0" width="900" height="600" fill="url(#sky)"/>
  <rect x="0" y="0" width="900" height="600" fill="url(#glow)"/>
  <rect x="0" y="0" width="900" height="600" fill="url(#waves)"/>

  <!-- Lua e brilho -->
  <circle cx="800" cy="90" r="30" fill="#F4E8C8" opacity="0.9"/>
  <circle cx="792" cy="82" r="27" fill="#1B3A4B" opacity="0.9"/>
  <circle cx="800" cy="90" r="42" fill="#F4E8C8" opacity="0.08"/>

  <!-- Céu estrelado espalhado -->
  <g fill="#F4E8C8" opacity="0.8">
    <circle cx="60" cy="60" r="1.4"/><circle cx="120" cy="110" r="1"/><circle cx="200" cy="55" r="1.6"/>
    <circle cx="270" cy="130" r="1"/><circle cx="330" cy="45" r="1.3"/><circle cx="40" cy="200" r="1"/>
    <circle cx="90" cy="470" r="1.4"/><circle cx="140" cy="530" r="1"/><circle cx="250" cy="480" r="1.2"/>
    <circle cx="60" cy="560" r="1"/><circle cx="770" cy="450" r="1.3"/><circle cx="720" cy="500" r="1"/>
    <circle cx="850" cy="380" r="1.4"/><circle cx="640" cy="60" r="1.2"/>
    <circle cx="580" cy="30" r="1"/><circle cx="860" cy="220" r="1"/>
    <circle cx="30" cy="330" r="1.2"/><circle cx="880" cy="280" r="1"/><circle cx="500" cy="30" r="1"/>
    <circle cx="150" cy="380" r="0.9"/><circle cx="210" cy="420" r="1.1"/><circle cx="340" cy="500" r="1"/>
    <circle cx="380" cy="20" r="1.2"/><circle cx="700" cy="130" r="1"/><circle cx="100" cy="30" r="1.1"/>
  </g>
  <!-- estrelas cadentes -->
  <g stroke="#F4E8C8" stroke-width="1" opacity="0.5" stroke-linecap="round">
    <path d="M650,50 L690,80"/>
    <path d="M110,140 L140,162"/>
  </g>

  <!-- Moldura estilo cartaz, dupla -->
  <rect x="18" y="18" width="864" height="564" fill="none" stroke="#E1D2AD" stroke-width="2" opacity="0.85"/>
  <rect x="27" y="27" width="846" height="546" fill="none" stroke="#E1D2AD" stroke-width="1" opacity="0.5"/>
  <g stroke="#E1D2AD" stroke-width="2" opacity="0.85">
    <path d="M18,44 L18,18 L44,18"/>
    <path d="M856,18 L882,18 L882,44"/>
    <path d="M882,556 L882,582 L856,582"/>
    <path d="M44,582 L18,582 L18,556"/>
  </g>
  <!-- florões decorativos nos cantos -->
  <g fill="#E1D2AD" opacity="0.6">
    <circle cx="18" cy="18" r="3"/><circle cx="882" cy="18" r="3"/>
    <circle cx="18" cy="582" r="3"/><circle cx="882" cy="582" r="3"/>
  </g>

  <!-- Faixa/cartucho do título -->
  <g transform="translate(450,52)">
    <path d="M-150,-16 L150,-16 L165,0 L150,16 L-150,16 L-165,0 Z" fill="#12303F" stroke="#E1D2AD" stroke-width="1.3"/>
    <text x="0" y="7" text-anchor="middle" font-family="Georgia, serif" font-size="22" letter-spacing="3" fill="#F4E8C8">MAPA ABERTO</text>
  </g>

  <!-- Massa continental: Brasil (estilizado, com relevo) -->
  <path d="M420,105 Q500,68 600,84 Q690,98 728,168 Q753,228 733,308 Q718,378 692,436 Q652,504 572,509 Q482,514 432,464 Q387,414 377,334 Q367,244 387,174 Q402,124 420,105 Z"
        fill="url(#land)" stroke="#8A7350" stroke-width="1.6"/>
  <!-- linhas de relevo -->
  <g fill="none" stroke="#B79F73" stroke-width="1" opacity="0.55">
    <path d="M450,160 Q480,150 510,165"/>
    <path d="M470,190 Q500,178 535,195"/>
    <path d="M520,340 Q550,330 580,345"/>
    <path d="M480,400 Q510,390 545,405"/>
    <path d="M600,220 Q630,208 660,222"/>
  </g>
  <!-- textura pontilhada -->
  <g fill="#8A7350" opacity="0.3">
    <circle cx="460" cy="230" r="1.2"/><circle cx="510" cy="200" r="1.2"/><circle cx="560" cy="360" r="1.2"/>
    <circle cx="630" cy="270" r="1.2"/><circle cx="440" cy="410" r="1.2"/><circle cx="670" cy="190" r="1.2"/>
    <circle cx="600" cy="420" r="1.2"/><circle cx="420" cy="300" r="1.2"/>
  </g>

  <!-- Massa continental: Chile (estilizado, com relevo) -->
  <path d="M205,235 Q227,250 221,300 Q216,362 205,422 Q195,472 175,507 Q155,482 150,422 Q145,342 160,282 Q175,240 205,235 Z"
        fill="url(#land)" stroke="#8A7350" stroke-width="1.6"/>
  <g fill="none" stroke="#B79F73" stroke-width="0.9" opacity="0.5">
    <path d="M180,270 Q195,260 210,272"/>
    <path d="M175,340 Q190,330 205,340"/>
    <path d="M170,420 Q185,410 200,420"/>
  </g>
  <g fill="#8A7350" opacity="0.3">
    <circle cx="190" cy="260" r="1.1"/><circle cx="175" cy="440" r="1.1"/><circle cx="200" cy="380" r="1.1"/>
  </g>

  <!-- Rota pontilhada conectando os destinos -->
  <path d="M460,170 C520,210 560,240 585,300 C485,340 320,350 195,360"
        fill="none" stroke="#E8734A" stroke-width="2.6" stroke-dasharray="2,8" stroke-linecap="round"/>
  <path d="M460,170 C520,210 560,240 585,300 C485,340 320,350 195,360"
        fill="none" stroke="#E8734A" stroke-width="6" opacity="0.12"/>

  <!-- waypoints -->
  <g fill="#E8734A">
    <circle cx="522" cy="212" r="3.2"/>
    <circle cx="365" cy="347" r="3.2"/>
  </g>

  <!-- Aviãozinho de papel sobre a rota -->
  <g transform="translate(522,207) rotate(35)" fill="#F4E8C8" stroke="#0F2A38" stroke-width="0.6">
    <path d="M-11,0 L11,0 L0,-7 Z M0,-7 L-4.5,7 L0,3.5 L4.5,7 Z"/>
  </g>

  <!-- Bússola decorativa detalhada -->
  <g transform="translate(825,180)">
    <circle r="30" fill="#12303F" stroke="#E1D2AD" stroke-width="1.4"/>
    <circle r="24" fill="none" stroke="#E1D2AD" stroke-width="0.7" opacity="0.7"/>
    <path d="M0,-24 L5,0 L0,24 L-5,0 Z" fill="#E8734A"/>
    <path d="M-24,0 L0,5 L24,0 L0,-5 Z" fill="#E1D2AD" opacity="0.6"/>
    <circle r="3" fill="#E1D2AD"/>
    <text x="0" y="-34" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#E1D2AD">N</text>
    <text x="0" y="42" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#E1D2AD">S</text>
  </g>

  <!-- Escala decorativa -->
  <g transform="translate(60,555)" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#C9B896">
    <line x1="0" y1="0" x2="90" y2="0" stroke="#E1D2AD" stroke-width="1.5"/>
    <line x1="0" y1="-4" x2="0" y2="4" stroke="#E1D2AD" stroke-width="1.5"/>
    <line x1="45" y1="-4" x2="45" y2="4" stroke="#E1D2AD" stroke-width="1.5"/>
    <line x1="90" y1="-4" x2="90" y2="4" stroke="#E1D2AD" stroke-width="1.5"/>
    <text x="0" y="16">0</text>
    <text x="78" y="16">~2000km</text>
  </g>

  <!-- ===== Destino 1: Lençóis Maranhenses ===== -->
  <g transform="translate(460,170)" filter="url(#softShadow)">
    <path d="M0,0 C-23,-31 -21,-56 0,-56 C21,-56 23,-31 0,0 Z" fill="#E8734A" stroke="#B9542E" stroke-width="1"/>
    <circle cx="0" cy="-31" r="15" fill="#F4E8C8"/>
    <path d="M-9,-27 Q-4.5,-35 0,-27 Q4.5,-19 9,-27" fill="none" stroke="#1B3A4B" stroke-width="2" stroke-linecap="round"/>
    <path d="M-9,-33 Q-4.5,-40 0,-33 Q4.5,-26 9,-33" fill="none" stroke="#1B3A4B" stroke-width="1.4" stroke-linecap="round" opacity="0.7"/>
    <circle cx="6" cy="-38" r="3" fill="#F2C24C"/>
  </g>
  <g>
    <path d="M478,132 L618,132 L628,141 L618,150 L478,150 Z" fill="#12303F" opacity="0.85"/>
    <text x="488" y="145" font-family="Georgia, serif" font-size="17" font-weight="700" fill="#F4E8C8">Lençóis Maranhenses</text>
  </g>
  <text x="488" y="166" font-family="Helvetica, Arial, sans-serif" font-size="12" font-style="italic" fill="#C9B896">Maranhão, Brasil — dunas e lagoas</text>

  <!-- ===== Destino 2: Chapada Diamantina ===== -->
  <g transform="translate(585,300)" filter="url(#softShadow)">
    <path d="M0,0 C-23,-31 -21,-56 0,-56 C21,-56 23,-31 0,0 Z" fill="#E8734A" stroke="#B9542E" stroke-width="1"/>
    <circle cx="0" cy="-31" r="15" fill="#F4E8C8"/>
    <path d="M-10,-25 L-3,-40 L1,-33 L5,-42 L11,-25 Z" fill="#1B3A4B"/>
    <path d="M4,-42 L6,-38 L2,-38 Z" fill="#F4E8C8"/>
  </g>
  <g>
    <path d="M603,262 L738,262 L748,271 L738,280 L603,280 Z" fill="#12303F" opacity="0.85"/>
    <text x="613" y="275" font-family="Georgia, serif" font-size="17" font-weight="700" fill="#F4E8C8">Chapada Diamantina</text>
  </g>
  <text x="613" y="296" font-family="Helvetica, Arial, sans-serif" font-size="12" font-style="italic" fill="#C9B896">Bahia, Brasil — serras e cachoeiras</text>

  <!-- ===== Destino 3: Vale do Elqui ===== -->
  <g transform="translate(195,360)" filter="url(#softShadow)">
    <path d="M0,0 C-23,-31 -21,-56 0,-56 C21,-56 23,-31 0,0 Z" fill="#E8734A" stroke="#B9542E" stroke-width="1"/>
    <circle cx="0" cy="-31" r="15" fill="#12303F"/>
    <g fill="#F4E8C8">
      <path d="M0,-40 L1.7,-34.5 7.4,-34.3 2.8,-30.8 4.4,-25.4 0,-28.8 -4.4,-25.4 -2.8,-30.8 -7.4,-34.3 -1.7,-34.5 Z" transform="scale(0.6)"/>
      <circle cx="-7" cy="-25" r="1"/>
      <circle cx="7" cy="-23" r="1"/>
      <circle cx="0" cy="-20" r="0.8"/>
    </g>
  </g>
  <g>
    <path d="M60,322 L165,322 L175,331 L165,340 L60,340 Z" fill="#12303F" opacity="0.85"/>
    <text x="70" y="335" font-family="Georgia, serif" font-size="17" font-weight="700" fill="#F4E8C8">Vale do Elqui</text>
  </g>
  <text x="70" y="356" font-family="Helvetica, Arial, sans-serif" font-size="12" font-style="italic" fill="#C9B896">Chile — céus mais límpidos do mundo</text>

  <!-- Legenda inferior -->
  <text x="450" y="573" text-anchor="middle" font-family="Georgia, serif" font-size="14" font-style="italic" fill="#C9B896">
    Do litoral às montanhas — do Brasil ao Chile
  </text>
</svg>
